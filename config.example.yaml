credentials:
  username: "your_net_id"
  password: "your_password"

preferences:
  activity: "Badminton"
  center: "Shaw Sports Complex"            # Primary preferred center
  centers:                                 # Priority order; others from dropdown auto-appended
    - "Shaw Sports Complex"
    - "Kwong On Jubilee Sports Centre"
  preferred_days: [1, 2, 4]       # 0=Mon, 1=Tue, 2=Wed, 3=Thu, 4=Fri, 5=Sat, 6=Sun
  time_range:
    start: "14:00"
    end: "18:00"
  slot_priority_starts: []           # Optional: fixed start-time priority, e.g. ["19:30", "18:30", "20:30"]
  book_days_ahead: 7              # Book the slot N days from now
  prefer_consecutive: 2           # Normal mode: prefer 2 consecutive slots; rush overrides below
  min_slot_start: "09:30"         # Rush floor: accept any slot at/after this start
  weekly_max_slots: 4             # Max slots per week; skip if reached

settings:
  headless: true                  # Run browser in headless mode
  timeout: 30000                  # Page timeout in ms
  retry_count: 6                  # Retry on failure (handles maintenance windows)
  retry_interval: 5               # Base seconds between retries (exponential backoff)
  rush_retry_waves: 3
  rush_pre_fire_ms: 0             # Positive = click Search this many ms before 08:30:00 (legacy)
  rush_boundary_enabled: true     # Small open-window probe set instead of single fire
  rush_boundary_offsets_ms: [-200, 0, 200, 500]  # Signed offsets from open; cancel on inventory
  rush_boundary_max_probes: 5
  rush_timetable_first_wait_ms: 24000   # Rush: wait for timetable after Search (no re-click)
  rush_timetable_retry_wait_ms: 16000  # One re-click only if first wait times out
  rush_timetable_probe_ms: [1200, 3200, 6800]  # Probe checkpoints (ms) before guarded re-click
  rush_reclick_guard_ms: 1400    # Min gap between guarded Search re-clicks
  rush_warmup_mode: "mixed"      # head | mixed (HEAD + lightweight GET + static probes)
  rush_retry_offsets_s: [1, 3, 6, 10]  # Extra retry waves after initial scan
  rush_extra_tab_deadline_s: 2.0  # Skip extra center tabs if not ready this many seconds before rush
  same_slot_retry_limit: 3        # Conflict retry attempts for the same slot
  same_slot_retry_budget_ms: 3000 # Total budget for same-slot conflict retries
  next_click_backoff_ms: [150, 300, 500]  # Next button short retries before fallback
  rush_prefer_consecutive: 1      # Rush default: lock one slot first
  rush_selection_mode: "first_acceptable"  # first_acceptable | ranked
  rush_slot_select_timeout_ms: 200   # Wait for Next enable after slot click
  rush_confirm_page_timeout_ms: 800  # Wait for confirm page after Next
  rush_confirm_result_timeout_ms: 1500  # Wait for confirm/result DOM
  experiment_id: "baseline"       # Tag runs for A/B / gray rollout
  strategy_version: "rush-api-search-race-v1"
  booking_mode: "ui"             # ui | hybrid | api
  rush_time_sync_enabled: true   # Align local trigger with server Date header
  rush_time_sync_samples: 5      # Number of probes for median delta
  rush_time_sync_timeout_ms: 1500

stealth:
  human_delay_min: 0.3            # Min seconds between actions
  human_delay_max: 1.5            # Max seconds between actions
  typing_delay_min: 50            # Min ms per keystroke
  typing_delay_max: 150           # Max ms per keystroke
  use_real_chrome: true           # Use installed Chrome instead of Chromium

selectors:
  search_date: "#searchDate"
  activity: "#actvId"
  center: "#ctrId"
  search_button: "#searchButton"
  next_button: "#nextButton"
  timetable: "table.tt-timetable"
  sports_facility_button: 'a:has-text("Sports Facility"), button:has-text("Sports Facility")'
  unavailable_class_markers: ["not-avail", "unavail", "closed"]

api:
  enabled: false
  base_url: "https://www40.polyu.edu.hk"
  search_endpoint: "/starspossfbstud/secure/ui_make_book/timetable.json"
  prepare_endpoint: "/starspossfbstud/secure/ui_make_book/make_book.do"
  submit_endpoint: "/starspossfbstud/secure/ui_make_book/make_book_submit.do"
  request_timeout_ms: 2500
  retry_count: 2
  rush_search_race: true          # Race API Search with UI at open
  submit_canary: false            # true = try API prepare/submit after API Search hit
